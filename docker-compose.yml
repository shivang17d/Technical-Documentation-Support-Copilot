services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: vector_rag
    ports: ["5433:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d vector_rag"]
      interval: 5s
      timeout: 3s
      retries: 20
  app:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://rag:rag@db:5432/vector_rag
    ports: ["8000:8000"]
    volumes: ["./uploads:/srv/uploads"]
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata:
